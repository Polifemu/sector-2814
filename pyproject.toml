[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sector2814"
version = "0.1.0"
description = "Sector 2814 - the crown: local-first agent swarm for security and privacy patrol"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

[project.scripts]
sector2814 = "sector2814.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
